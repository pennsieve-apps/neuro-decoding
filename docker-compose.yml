services:
  processor:
    build:
      context: .
      dockerfile: Dockerfile
    image: neuro-decoding:dev
    platform: linux/amd64
    user: "1000"
    mem_limit: 2g
    cpus: 2
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    env_file:
      - dev.env
    volumes:
      - ./data/fixture/linked:/data/input:ro
      - ./data/output:/data/output
